<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Bastion Siege</title>
  <meta name="description" content="Defend your castle against endless waves. Build towers, take aim yourself, and hold the line with friends.">
  <meta name="theme-color" content="#1b2140">
  <link rel="manifest" href="icons/manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bastion Siege">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Grenze+Gotisch:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="game-view" hidden>
      <header id="hud" aria-label="Status"></header>
      <div id="board-wrap">
        <canvas id="board" aria-label="Battlefield"></canvas>
        <div id="wave-banner" aria-live="polite"></div>
        <div id="board-overlay"></div>
      </div>
      <footer id="dock" aria-label="Build"></footer>
      <aside id="panel" hidden></aside>
    </section>
    <section id="screen" aria-live="polite"></section>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <noscript>Bastion Siege needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
