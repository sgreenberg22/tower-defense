<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Bastion Siege</title>
  <meta name="description" content="Defend your castle against endless waves. Build towers, take aim yourself, and hold the line with friends.">
  <meta name="theme-color" content="#1b2140">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='22' width='48' height='36' rx='4' fill='%23cfd3dc' stroke='%231e2433' stroke-width='4'/%3E%3Cpath d='M4 24 L16 8 L28 24Z M36 24 L48 8 L60 24Z' fill='%233d5fae' stroke='%231e2433' stroke-width='4'/%3E%3Cpath d='M26 58 V44 a6 6 0 0 1 12 0 V58Z' fill='%235b3a24' stroke='%231e2433' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Grenze+Gotisch:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="game-view" hidden>
      <header id="hud" aria-label="Status"></header>
      <div id="board-wrap">
        <canvas id="board" aria-label="Battlefield"></canvas>
        <div id="wave-banner" aria-live="polite"></div>
        <div id="board-overlay"></div>
      </div>
      <footer id="dock" aria-label="Build"></footer>
      <aside id="panel" hidden></aside>
    </section>
    <section id="screen" aria-live="polite"></section>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <noscript>Bastion Siege needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
